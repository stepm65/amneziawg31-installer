name: Release
# Publishes the installer archive and its SHA256 sum for a version tag vX.Y.Z.
# install.sh and `awg31 update` download exactly these files.
# Two ways to start it, both end with the same release:
#   - push a tag:            git tag v1.2.3 && git push origin v1.2.3
#   - on github.com:         Releases -> Draft a new release -> create the tag -> Publish
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  release:
    types: [published]
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag must match the VERSION file
        run: |
          case "$GITHUB_REF_NAME" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::Release tags must look like v1.2.3, got $GITHUB_REF_NAME"; exit 1 ;;
          esac
          if [ "v$(tr -d '[:space:]' < VERSION)" != "$GITHUB_REF_NAME" ]; then
            echo "::error::VERSION is $(cat VERSION) but the tag is $GITHUB_REF_NAME"
            exit 1
          fi
      - name: Tests
        run: |
          python -m pip install -r src/requirements.txt pytest httpx
          find . -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
          python -m compileall -q src
          python -m pytest -q
      - name: Build archive and checksum
        run: bash scripts/build-release.sh "$GITHUB_REF_NAME" dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          Install or update with one command (run as root):

          \`\`\`bash
          bash <(curl -Ls https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/install.sh) ${GITHUB_REF_NAME}
          \`\`\`

          The installer verifies \`awg31-console-${GITHUB_REF_NAME}.tar.gz\` against the \`.sha256\` file published here and aborts on a mismatch.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            # The release was created on github.com: attach the files to it.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag \
              --title "AmneziaWG 3.1 Console ${GITHUB_REF_NAME#v}" --notes-file notes.md
          fi
