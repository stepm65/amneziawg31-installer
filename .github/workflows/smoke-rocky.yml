name: Install smoke test (Rocky Linux)
# The same end-to-end check as on Ubuntu, inside a Rocky Linux 9 virtual machine
# (KVM on the runner): its own kernel, DKMS build, SELinux enforcing, dnf.
on:
  push:
  pull_request:
jobs:
  rocky9:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM and install QEMU
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils cloud-image-utils
          ls -l /dev/kvm
      - name: Boot Rocky Linux 9
        run: |
          set -eu
          curl -fsSL --retry 3 -o rocky.qcow2 https://dl.rockylinux.org/pub/rocky/9/images/x86_64/Rocky-9-GenericCloud-Base.latest.x86_64.qcow2
          qemu-img resize rocky.qcow2 20G
          ssh-keygen -q -t ed25519 -N '' -f vmkey
          cat > user-data <<CFG
          #cloud-config
          disable_root: false
          ssh_pwauth: false
          users:
            - name: root
              ssh_authorized_keys:
                - $(cat vmkey.pub)
          CFG
          printf 'instance-id: awg31-smoke\nlocal-hostname: rocky-smoke\n' > meta-data
          cloud-localds seed.img user-data meta-data
          sudo qemu-system-x86_64 -enable-kvm -cpu host -smp 4 -m 6144 -display none -daemonize \
            -drive file=rocky.qcow2,if=virtio -drive file=seed.img,if=virtio,format=raw \
            -nic user,model=virtio-net-pci,hostfwd=tcp:127.0.0.1:2222-:22 -serial file:serial.log
          cat > vm <<'SH'
          #!/usr/bin/env bash
          exec ssh -i vmkey -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o LogLevel=ERROR -o ConnectTimeout=10 root@127.0.0.1 "$@"
          SH
          chmod +x vm
          for attempt in $(seq 1 60); do ./vm true 2>/dev/null && break; sleep 5; done
          ./vm 'cat /etc/rocky-release; uname -r; getenforce'
      - name: Bring the kernel up to date and reboot
        # kernel-devel exists in the repositories only for the current kernel.
        run: |
          set -eu
          ./vm 'dnf -y -q update kernel kernel-core kernel-modules && dnf -y -q install tar' 
          ./vm 'systemctl reboot' || true
          sleep 20
          for attempt in $(seq 1 60); do ./vm true 2>/dev/null && break; sleep 5; done
          ./vm 'uname -r'
      - name: Install, exercise and purge
        run: |
          set -eu
          tar --exclude=.git --exclude=rocky.qcow2 --exclude=seed.img --exclude=vmkey -c . | ./vm 'mkdir -p /root/src && tar -x -C /root/src'
          ./vm 'cd /root/src && CI=true AWG31_SMOKE_NGINX=no bash tests/smoke/check_install.sh'
      - name: Logs on failure
        if: failure()
        run: |
          ./vm "journalctl -u awg31-panel -u awg31-bot -u 'awg-quick@awg0' -n 80 --no-pager; dkms status; ausearch -m avc -ts recent 2>/dev/null | tail -n 30" || true
          sudo tail -n 40 serial.log || true
