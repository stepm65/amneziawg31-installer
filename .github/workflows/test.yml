name: Static and unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the system Python of Rocky Linux 9, 3.12 of Ubuntu 24.04 and Rocky Linux 10.
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test requirements
        run: python -m pip install -r src/requirements.txt pytest httpx cryptography
      - name: Bash syntax
        run: find . -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
      - name: Python syntax and tests
        run: python -m compileall -q src && python -m pytest -q
      - name: Installer download and checksum tests (need root)
        run: sudo env "PATH=$PATH" python -m pytest -q tests/test_quickstart.py
