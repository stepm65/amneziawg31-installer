name: Static and unit tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # System Pythons: 3.9 Rocky Linux 9, 3.12 Ubuntu 24.04 and Rocky Linux 10, 3.14 Ubuntu 26.04.
        python: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install test requirements
        run: python -m pip install -r src/requirements.txt pytest httpx cryptography
      - name: Bash syntax
        run: find . -name '*.sh' -type f -print0 | xargs -0 -n1 bash -n
      - name: Python syntax and tests
        run: python -m compileall -q src && python -m pytest -q
      - name: Installer download, checksum and control helper tests (need root)
        run: sudo env "PATH=$PATH" python -m pytest -q tests/test_quickstart.py tests/test_helper.py
